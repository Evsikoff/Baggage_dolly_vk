[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zone-puzzle-levelgen"
version = "0.1.0"
description = "Generator, solver and quality evaluator for 7x7 zone puzzles"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zone-levelgen = "levelgen.cli:main"

[tool.setuptools.packages.find]
include = ["levelgen*"]

